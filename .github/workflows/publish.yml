name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@v2.0.0
    permissions:
      contents: read
    with:
      timeout-minutes: 60
      packages: >-
        ovo-types
        ovo-protocol
        ovo-obs
        ovo-tools
        ovo-llm
        ovo-agent
        ovo-workflow
        ovo-state
        ovo-compaction
        ovo-sandbox
        ovo-toolkit
        ovo-runtime
        ovo
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
