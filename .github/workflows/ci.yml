name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@main
    with:
      submodules: true

  sandbox-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p ovo-sandbox --bin ovo-landlock --features landlock
      - run: cargo test -p ovo-sandbox -p ovo-toolkit --features landlock --all-targets
        env:
          OVO_LANDLOCK_HELPER: ${{ github.workspace }}/target/debug/ovo-landlock

  sandbox-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ovo-sandbox -p ovo-toolkit --features seatbelt --all-targets
