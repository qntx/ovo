[workspace]
members = ["crates/*"]
default-members = ["crates/ovo"]
exclude = ["3rdparty"]
resolver = "3"

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qntx/ovo"
description = "Enterprise embeddable agent runtime kernel"
keywords = ["ai", "agent", "llm", "workflow", "runtime"]
categories = ["api-bindings", "asynchronous"]

[workspace.dependencies]
ovo = { version = "0.9.1", path = "crates/ovo" }
ovo-types = { version = "0.9.1", path = "crates/ovo-types" }
ovo-protocol = { version = "0.9.1", path = "crates/ovo-protocol" }
ovo-tools = { version = "0.9.1", path = "crates/ovo-tools" }
ovo-llm = { version = "0.9.1", path = "crates/ovo-llm" }
ovo-agent = { version = "0.9.1", path = "crates/ovo-agent" }
ovo-runtime = { version = "0.9.1", path = "crates/ovo-runtime" }
ovo-workflow = { version = "0.9.1", path = "crates/ovo-workflow" }
ovo-toolkit = { version = "0.9.1", path = "crates/ovo-toolkit" }
ovo-state = { version = "0.9.1", path = "crates/ovo-state" }
ovo-compaction = { version = "0.9.1", path = "crates/ovo-compaction" }
ovo-obs = { version = "0.9.1", path = "crates/ovo-obs" }
ovo-sandbox = { version = "0.9.1", path = "crates/ovo-sandbox" }

async-trait = "0.1.92"
futures = "0.3.34"
jsonschema = { version = "0.52.0", default-features = false }
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rhai = { version = "1.25.1", default-features = false, features = ["std", "sync", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["sync", "macros", "rt", "time", "rt-multi-thread", "net", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = 0

[profile.test]
opt-level = 2

[profile.ci]
debug = false
inherits = "dev"

[profile.bench]
debug = true
inherits = "release"

[workspace.lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "warn"
single_use_lifetimes = "warn"
unused_lifetimes = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
variant_size_differences = "warn"
unused_qualifications = "warn"
unused_imports = "warn"
unused_macro_rules = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
non_ascii_idents = "deny"
non_camel_case_types = "warn"
non_snake_case = "warn"
non_upper_case_globals = "warn"
keyword_idents = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "allow", priority = -1 }

dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
panic = "warn"
unwrap_used = "warn"
unwrap_in_result = "warn"
expect_used = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
exit = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
mem_forget = "warn"
clone_on_ref_ptr = "allow"
rc_buffer = "warn"
rc_mutex = "warn"

fallible_impl_from = "warn"
error_impl_error = "warn"
# Host reply channels often intentionally ignore send results.
let_underscore_must_use = "allow"

rest_pat_in_fully_bound_structs = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
large_types_passed_by_value = "warn"
implicit_hasher = "warn"
redundant_type_annotations = "warn"

str_to_string = "warn"
string_lit_as_bytes = "warn"
needless_raw_string_hashes = "warn"
format_push_string = "warn"

cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
as_underscore = "warn"
cast_precision_loss = "allow"

future_not_send = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
significant_drop_tightening = "warn"

match_wildcard_for_single_variants = "warn"
match_same_arms = "allow"
option_if_let_else = "allow"
wildcard_enum_match_arm = "allow"

cognitive_complexity = "warn"
too_many_lines = "warn"
# Rhai host registration and dispatch wave logic are inherently nested; keep
# complexity visible via cognitive_complexity / too_many_lines instead.
excessive_nesting = "allow"

used_underscore_binding = "warn"
verbose_file_reads = "warn"
tests_outside_test_module = "warn"
unnecessary_self_imports = "warn"
infinite_loop = "warn"
allow_attributes_without_reason = "warn"
missing_assert_message = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"

# Rhai requires `Box<EvalAltResult>`; host reply channels use fire-and-forget acks.
boxed_local = "allow"
unnecessary_box_returns = "allow"
# Host error types and maps are small; pass-by-value keeps call sites simple.
needless_pass_by_value = "allow"
# JSON Schema / serde_json::Value cannot implement Eq.
derive_partial_eq_without_eq = "allow"
# Const fn is nice-to-have; not a production correctness gate.
missing_const_for_fn = "allow"
assigning_clones = "allow"
redundant_clone = "allow"
unused_self = "allow"
map_unwrap_or = "allow"
unnested_or_patterns = "allow"
unnecessary_wraps = "allow"
unnecessary_literal_bound = "allow"
or_fun_call = "allow"
default_trait_access = "allow"
needless_borrows_for_generic_args = "allow"
equatable_if_let = "allow"

missing_docs_in_private_items = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
doc_markdown = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"

exhaustive_enums = "allow"
exhaustive_structs = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
# Async/Rhai host adapters re-bind channel state in short scopes.
shadow_unrelated = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
semicolon_inside_block = "allow"
semicolon_outside_block = "allow"
redundant_pub_crate = "allow"
