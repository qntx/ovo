[package]
name = "ovo-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Process sandbox policy and backends for Ovo tools"
keywords = ["ai", "agent", "sandbox", "security"]
categories = ["os", "asynchronous"]

[features]
default = []
# macOS Seatbelt via /usr/bin/sandbox-exec (no-op compile on other OSes).
seatbelt = []
# Linux Landlock via the ovo-landlock helper (no-op compile on other OSes).
landlock = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4.7" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
tempfile = { workspace = true }

[[bin]]
name = "ovo-landlock"
path = "src/bin/ovo-landlock.rs"
# Do NOT set required-features: macOS --all-features must compile this bin as a stub.

[lints]
workspace = true
