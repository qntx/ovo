[package]
name = "ovo-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Turn runtime, session host, and nested agents for Ovo"
keywords = ["ai", "agent", "runtime"]
categories = ["asynchronous"]

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
jsonschema = { workspace = true }
ovo-agent = { workspace = true }
ovo-compaction = { workspace = true }
ovo-llm = { workspace = true }
ovo-obs = { workspace = true }
ovo-protocol = { workspace = true }
ovo-sandbox = { workspace = true }
ovo-state = { workspace = true }
ovo-tools = { workspace = true }
ovo-types = { workspace = true }
ovo-workflow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ovo-toolkit = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "turn_spawn"
harness = false

[lints]
workspace = true
